<!doctype html><meta charset="utf-8"><title>lab</title>
<style>html,body{margin:0;background:#222}iframe{border:0;display:block;visibility:hidden;position:absolute;left:0;top:0}</style>
<div id="host"></div>
<script>
const q0 = new URLSearchParams(location.search);
const LOCS = q0.get('u') ? q0.get('u').split(',') : ['/', '/es/', '/fr/', '/it/', '/de/'];
const NAME = ['en', 'es', 'fr', 'it', 'de'];
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1440);
const PAGE = q.get('p') || '';

function build() {
  const host = document.getElementById('host');
  host.innerHTML = '';
  return Promise.all(LOCS.map((l, k) => new Promise((res) => {
    const f = document.createElement('iframe');
    f.width = W; f.height = 30000; f.id = 'f' + k;
    f.src = l + PAGE;
    f.onload = () => res(f);
    host.appendChild(f);
  })));
}

function lines(el) {
  const d = el.ownerDocument;
  const r = d.createRange();
  r.selectNodeContents(el);
  const rects = [...r.getClientRects()].filter((x) => x.width > 0.5 && x.height > 0.5);
  if (!rects.length) return 1;
  const tops = new Set(rects.map((x) => Math.round(x.top / 2)));
  return tops.size;
}

function scan(doc) {
  doc.querySelector('.consent-bar')?.remove();
  const skip = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'SVG', 'PATH', 'BR', 'HEAD', 'META', 'LINK', 'TITLE']);
  const out = [];
  const all = doc.querySelectorAll('body *');
  for (const el of all) {
    if (skip.has(el.tagName) || el.closest('svg')) continue;
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) continue;
    if ([...el.children].some((c) => c.textContent.trim())) continue;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    if (r.left < -1000) continue;
    const cs = getComputedStyle(el);
    out.push({
      k: el.tagName.toLowerCase() + (el.className ? '.' + String(el.className).trim().split(/\s+/).join('.') : ''),
      n: lines(el),
      w: Math.round(r.width), h: Math.round(r.height),
      fs: Math.round(parseFloat(cs.fontSize) * 10) / 10,
      ov: el.scrollWidth > el.clientWidth + 1 ? 1 : 0,
      t: t.length > 64 ? t.slice(0, 64) + '…' : t,
    });
  }
  const secs = [...doc.querySelectorAll('section')].map((s) => Math.round(s.getBoundingClientRect().height));
  return { out, secs, docH: Math.round(doc.body.scrollHeight), sw: doc.documentElement.scrollWidth, cw: doc.documentElement.clientWidth };
}



/* ── contrast ───────────────────────────────────────────────────────────
   Text colour against the first opaque background behind it. Elements over
   an image or gradient are skipped rather than guessed at. */
function contrastAudit(doc, win) {
  const px = (c) => {
    const m = String(c).match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    const p = m[1].split(',').map(Number);
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  };
  const lum = (c) => {
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
  };
  const ratio = (a, b) => { const l1 = lum(a), l2 = lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); };
  const bgOf = (el) => {
    let n = el;
    while (n && n.nodeType === 1) {
      const cs = win.getComputedStyle(n);
      if (cs.backgroundImage && cs.backgroundImage !== 'none') return null;
      const c = px(cs.backgroundColor);
      if (c && c.a >= 0.95) return c;
      n = n.parentElement;
    }
    return null;
  };
  const out = [];
  for (const el of doc.querySelectorAll('body *')) {
    if ([...el.children].some((c) => c.textContent.trim())) continue;
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) continue;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2 || r.left < -1000) continue;
    const cs = win.getComputedStyle(el);
    if (cs.visibility === 'hidden' || +cs.opacity < 0.5) continue;
    const fg = px(cs.color); const bg = bgOf(el);
    if (!fg || !bg) continue;
    const size = parseFloat(cs.fontSize);
    const bold = +cs.fontWeight >= 700;
    const large = size >= 24 || (size >= 18.66 && bold);
    const need = large ? 3 : 4.5;
    const got = ratio(fg, bg);
    if (got < need) out.push({ code: 'low-contrast', detail: `${got.toFixed(2)}:1 need ${need} · ${Math.round(size)}px · ${el.className || el.tagName} · ${t.slice(0, 40)}` });
  }
  return out;
}

/* ── UX / UI audit ──────────────────────────────────────────────────────
   Structural and accessibility checks run inside each locale's document.
   Everything here is measured, not assumed. */
function auditDoc(doc, win) {
  const out = [];
  const add = (sev, code, detail) => out.push({ sev, code, detail: String(detail).slice(0, 140) });
  const de = doc.documentElement;
  const vw = de.clientWidth;
  const name = (el) => (el.getAttribute('aria-label') || el.textContent || el.getAttribute('title') || '').replace(/\s+/g, ' ').trim();

  if (de.scrollWidth > vw + 1) add('high', 'page-scrolls-sideways', `${de.scrollWidth} > ${vw}`);
  if (!de.lang) add('high', 'no-lang', 'html element has no lang');

  const ids = {};
  for (const el of doc.querySelectorAll('[id]')) {
    ids[el.id] = (ids[el.id] || 0) + 1;
  }
  for (const [id, n] of Object.entries(ids)) if (n > 1) add('high', 'duplicate-id', `${id} x${n}`);

  const h1 = doc.querySelectorAll('h1');
  if (h1.length !== 1) add('high', 'h1-count', `${h1.length} h1 elements`);
  let prev = 0;
  for (const h of doc.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
    const lvl = +h.tagName[1];
    if (prev && lvl > prev + 1) add('med', 'heading-skips-level', `h${prev} -> h${lvl}: ${name(h)}`);
    prev = lvl;
  }

  for (const img of doc.querySelectorAll('img')) {
    if (img.getAttribute('alt') === null) add('high', 'img-no-alt', img.getAttribute('src') || '?');
    if (!img.getAttribute('width') || !img.getAttribute('height')) add('low', 'img-no-dimensions', img.getAttribute('src') || '?');
    if (img.complete && img.naturalWidth === 0) add('high', 'img-broken', img.getAttribute('src') || '?');
  }

  for (const a of doc.querySelectorAll('a')) {
    const r = a.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    if (!name(a) && !a.querySelector('img[alt]:not([alt=""]),svg title')) add('high', 'link-no-name', a.getAttribute('href') || '?');
    const href = a.getAttribute('href');
    if (href === null || href === '' || href === '#') add('med', 'link-no-href', name(a));
    if (a.target === '_blank' && !/noopener/.test(a.rel || '')) add('med', 'blank-no-noopener', href || '?');
  }
  for (const b of doc.querySelectorAll('button,summary,[role="button"]')) {
    const r = b.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    if (!name(b)) add('high', 'control-no-name', b.className || b.tagName);
  }

  for (const f of doc.querySelectorAll('input,select,textarea')) {
    const t = (f.getAttribute('type') || '').toLowerCase();
    if (t === 'hidden') continue;
    const r = f.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    const lab = f.id ? doc.querySelector(`label[for="${CSS.escape(f.id)}"]`) : null;
    if (!lab && !f.getAttribute('aria-label') && !f.getAttribute('aria-labelledby') && !f.closest('label')) {
      add('high', 'field-no-label', f.name || f.id || f.tagName);
    }
    if (f.getAttribute('aria-describedby')) {
      for (const id of f.getAttribute('aria-describedby').split(/\s+/)) {
        if (id && !doc.getElementById(id)) add('med', 'describedby-missing', `${f.id} -> ${id}`);
      }
    }
  }

  /* Elements whose content is cut off by their own box. */
  for (const el of doc.querySelectorAll('body *')) {
    const cs = win.getComputedStyle(el);
    if (!/hidden|clip/.test(cs.overflowX)) continue;
    if (el.scrollWidth > el.clientWidth + 4 && el.clientWidth > 0) {
      const t = el.textContent.replace(/\s+/g, ' ').trim();
      if (t) add('med', 'text-clipped', `${el.className || el.tagName}: ${t.slice(0, 50)}`);
    }
  }

  /* Anything painted outside the viewport on either side. */
  for (const el of doc.querySelectorAll('body *')) {
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) continue;
    if (r.left < -1200) continue;              /* off-screen skip links and honeypots */
    if (r.right > vw + 1 || r.left < -1) {
      const cs = win.getComputedStyle(el);
      if (cs.position === 'fixed') continue;
      add('high', 'element-past-viewport', `${el.className || el.tagName} right=${Math.round(r.right)}`);
    }
  }

  /* Touch targets, phone widths only. */
  if (vw <= 500) {
    for (const el of doc.querySelectorAll('a,button,summary,input,select,[role="button"]')) {
      const r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1 || r.left < -1000) continue;
      if (el.closest('p,li,.po-read,.detail,.t-sm')) continue;   /* inline links in prose */
      if (r.height < 24 || r.width < 24) add('med', 'small-tap-target', `${Math.round(r.width)}x${Math.round(r.height)} ${name(el).slice(0, 34)}`);
    }
  }
  return out;
}

window.audit = async function () {
  const frames = await build();
  await Promise.all(frames.map((f) => f.contentDocument.fonts.ready));
  await new Promise((r) => setTimeout(r, 500));
  const report = {};
  frames.forEach((f, i) => {
    const d = f.contentDocument;
    d.querySelector('.consent-bar')?.remove();
    const rows = auditDoc(d, f.contentWindow).concat(contrastAudit(d, f.contentWindow).map((x) => ({ sev: 'med', ...x })));
    const by = {};
    for (const r of rows) (by[r.code] = by[r.code] || []).push(r.detail);
    report[NAME[i] || LOCS[i]] = { n: rows.length, codes: Object.fromEntries(Object.entries(by).map(([k, v]) => [k, { n: v.length, eg: v.slice(0, 3) }])) };
  });
  return report;
};

window.run = async function () {
  const frames = await build();
  await Promise.all(frames.map((f) => f.contentDocument.fonts.ready));
  await new Promise((r) => setTimeout(r, 400));
  const data = frames.map((f) => scan(f.contentDocument));
  const en = data[0];
  const report = { w: W, page: PAGE || '/', en: { els: en.out.length, docH: en.docH, secs: en.secs }, locales: {} };
  const lcs = (A, B) => {
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i].k === B[j].k ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const pairs = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i].k === B[j].k) { pairs.push([i, j]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    return pairs;
  };
  for (let i = 1; i < data.length; i++) {
    const d = data[i];
    const name = NAME[i];
    const rows = [];
    const pairs = lcs(en.out, d.out);
    for (const [x, y] of pairs) {
      const a = en.out[x], b = d.out[y];
      if (b.n > a.n || b.ov) rows.push({ k: b.k, en: a.n, [name]: b.n, ov: b.ov, w: b.w, fs: b.fs, enT: a.t, t: b.t });
    }
    report.locales[name] = {
      matched: pairs.length, els: d.out.length, docH: d.docH, dH: d.docH - en.docH,
      sw: d.sw, cw: d.cw, n: rows.length, rows: rows.slice(0, 90),
    };
  }
  return report;
};
</script>
