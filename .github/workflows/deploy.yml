name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails the build on a broken canonical, an incomplete hreflang cluster,
      # a missing alt, invalid JSON-LD or a post that does not match site.json.
      - name: Audit content
        run: node tools/build.mjs --check

      - name: Build
        run: node tools/build.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the archive drops dotfiles and /.well-known/security.txt 404s.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
